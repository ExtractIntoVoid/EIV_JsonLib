name: Publish Packages

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:
    # allow manual trigger

jobs:
  publish:
    strategy:
      matrix:
        project: [EIV_Items, EIV_Profile, EIV_Effects, EIV_DefinitionCore]
    permissions:
      contents: write
      packages: write
    uses: ExtractIntoVoid/workflows/.github/workflows/package.yml@main
    with:
      ProjName: ${{ matrix.project }}
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
